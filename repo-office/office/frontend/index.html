<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Office</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- shared shading used by every figure and prop to fake volume -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="g-shine" cx="32%" cy="26%" r="75%">
        <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-shade-r" x1="0" y1="0" x2="1" y2="0">
        <stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
      </linearGradient>
      <linearGradient id="g-shade-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
      </linearGradient>
      <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e7cfa4"/><stop offset="1" stop-color="#c9a574"/>
      </linearGradient>
      <linearGradient id="g-bezel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#14161b"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Agent Office</h1>
        <p>Colleagues talk in speech clouds, walk over for team chats, and phone other teams.</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="conn" class="conn conn-off"><i></i><span>connecting</span></span>
      <button id="log-btn" class="btn btn-ghost">Activity log</button>
      <button id="demo-btn" class="btn btn-ghost" title="Plays a scripted, clearly marked simulation">Run demo</button>
    </div>
  </header>

  <main id="floor" class="floor"></main>

  <aside id="drawer" class="drawer" hidden aria-label="Activity log">
    <div class="drawer-head">
      <strong id="drawer-title">All activity</strong>
      <span>
        <button id="drawer-clear" class="btn btn-ghost" hidden>Show everyone</button>
        <button id="drawer-close" class="btn btn-ghost">Close</button>
      </span>
    </div>
    <div id="drawer-list" class="drawer-list" role="log"></div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><strong id="modal-title"></strong><button id="modal-close" class="btn btn-ghost">Close</button></div>
      <pre id="modal-body"></pre>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="gate.js"></script> <!-- signs the admin in, then loads office.js -->
</body>
</html>
